# Base configuration
seed: 42
scale_factor: 4
device: null  # null = auto-detect (MPS on Mac, CUDA on Linux, CPU fallback)

data:
  patch_size: 128
  num_colors: 32
  palette_preset: null
  dither: false
  augment: true
  batch_size: 16
  num_workers: 2

training:
  epochs: 20
  lr: 0.0001
  save_freq: 5
  checkpoint_dir: "checkpoints"

loss:
  pixel_weight: 1.0
  gradient_weight: 0.1
  lpips_weight: 0.0
