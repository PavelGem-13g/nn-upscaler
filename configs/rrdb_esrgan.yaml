# Configuration for PSNR-oriented RRDBNet (Real-ESRGAN backbone)
seed: 42
scale_factor: 4
device: null  # Auto-detect (MPS / CUDA / CPU)

model:
  name: "rrdb"
  num_features: 64
  num_blocks: 6
  growth_channels: 32
  res_scale: 0.2

data:
  patch_size: 64
  batch_size: 8
  augment: true
  random_degradation: true

training:
  stage: "psnr"
  epochs: 15
  lr: 0.0001
  save_freq: 5
  checkpoint_dir: "checkpoints/rrdb"

loss:
  pixel_type: "charbonnier"
  pixel_weight: 1.0
  gradient_weight: 0.1
  fft_weight: 0.05
  vgg_weight: 0.0
  lpips_weight: 0.0
  gan_weight: 0.0
