# Configuration for Adversarial & Perceptual Fine-tuning (Stage 2)
seed: 42
scale_factor: 4
device: null

model:
  name: "esrgan"
  num_features: 64
  num_blocks: 6
  growth_channels: 32
  res_scale: 0.2

discriminator:
  name: "unet_spectral"
  num_features: 32

data:
  patch_size: 64
  batch_size: 4
  augment: true
  random_degradation: true

training:
  stage: "adversarial"
  gan: true
  epochs: 10
  lr_g: 0.0001
  lr_d: 0.0001
  save_freq: 2
  checkpoint_dir: "checkpoints/esrgan_adversarial"

loss:
  pixel_type: "charbonnier"
  pixel_weight: 1.0
  gradient_weight: 0.1
  fft_weight: 0.05
  vgg_weight: 0.1
  lpips_weight: 0.1
  gan_weight: 0.005
