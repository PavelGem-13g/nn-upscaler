# Configuration for Semantic and Prompt Conditioned Upscaler (Phase 4.2)
seed: 42
scale_factor: 4
device: null

model:
  name: "semantic_conditioned"
  num_features: 64
  cond_dim: 64
  num_blocks: 6
  text_dim: 512
  res_scale: 0.2

data:
  patch_size: 64
  batch_size: 8
  augment: true
  random_degradation: true

training:
  stage: "semantic"
  epochs: 15
  lr: 0.00015
  save_freq: 5
  checkpoint_dir: "checkpoints/semantic_conditioned"

loss:
  pixel_type: "charbonnier"
  pixel_weight: 1.0
  gradient_weight: 0.10
  fft_weight: 0.05
  vgg_weight: 0.10
  lpips_weight: 0.05
